name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce, expected and actual result
    validations:
      required: true
