name: Release

# Push a tag vX.Y.Z (see the /release skill). Builds store-ready zips and drafts a GitHub Release.
# Store submission is added later, once developer accounts and API credentials exist.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Tag matches package.json version
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - run: pnpm zip
      - run: pnpm zip:edge
      - run: pnpm zip:firefox
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: .output/*.zip
