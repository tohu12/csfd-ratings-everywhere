name: Store assets

# Run by hand (Actions → Store assets → Run workflow) after UI changes.
# Linux is required: Chromium honours --lang there, so chrome.i18n renders cs/en correctly.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-core
      - run: pnpm build
      - run: node tools/store-assets.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: store-assets
          path: docs/store/
          retention-days: 30
