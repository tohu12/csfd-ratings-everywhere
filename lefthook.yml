pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,js,json,md}"
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    typecheck:
      glob: "*.ts"
      run: pnpm typecheck

commit-msg:
  commands:
    conventional:
      run: >-
        grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+' {1}
        || (echo 'Commit message must follow Conventional Commits (e.g. "feat(content): linkify text")' && exit 1)
